name: Fetch IRP Prices

on:
  schedule:
    # 한국시간 오전 7시 = UTC 전날 22시, 매일
    - cron: '0 22 * * *'
  workflow_dispatch:  # 수동 실행 허용

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Fetch prices
        id: fetch
        run: node scripts/fetch-prices.js
        continue-on-error: true

      - name: Commit & push data
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "data: $(TZ='Asia/Seoul' date '+%Y-%m-%d') 기준가 업데이트" && git push
